services:
  mastra-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mastra
      POSTGRES_USER: mastra
      POSTGRES_PASSWORD: mastra
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mastra-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastra -d mastra"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    env_file:
      - apps/agent/.env
    environment:
      NODE_ENV: development
      PORT: 4111
      API_URL: http://host.docker.internal:3333
      MASTRA_DATABASE_URL: postgresql://mastra:mastra@mastra-db:5432/mastra
      MASTRA_INTERNAL_TOKEN: ${MASTRA_INTERNAL_TOKEN:-development-internal-token}
    depends_on:
      mastra-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGENT_PORT:-4111}:4111"
    volumes:
      - ./apps/agent/index.ts:/workspace/apps/agent/index.ts
      - ./apps/agent/storage.ts:/workspace/apps/agent/storage.ts
      - ./apps/agent/agents:/workspace/apps/agent/agents
      - ./apps/agent/tools:/workspace/apps/agent/tools
      - ./apps/agent/lib:/workspace/apps/agent/lib
      - ./apps/agent/scorers:/workspace/apps/agent/scorers
      - ./apps/agent/.data:/workspace/apps/agent/.data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:4111/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mastra-db-data:
